name: PlayToEarn Restock Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger a test run by hand

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          PLAYTOEARN_COOKIE: ${{ secrets.PLAYTOEARN_COOKIE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python playtoearn_monitor.py --once

      - name: Save updated state back to the repo
        run: |
          git config user.name "playtoearn-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add playtoearn_state.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push
